<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Trader Analyzer</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="page-shell">
    <header class="topbar">
        <div class="brand-block">
            <div class="logo">₿</div>
            <div>
                <div class="brand-name">Crypto Trader Analyzer</div>
                <div class="brand-subtitle">Trend · Risk · Execution</div>
            </div>
        </div>
    </header>

    <main class="content-grid">
        <section class="panel form-panel">
            <h1>Trader Strategy Review</h1>
            <form id="analysisForm">
                <div class="input-group">
                    <label for="coinName">Coin / Pair</label>
                    <input id="coinName" name="coinName" type="text" value="BTC" />
                </div>

                <div class="input-group">
                    <label for="marketTrend">Market Trend</label>
                    <select id="marketTrend" name="marketTrend">
                        <option value="Bullish">Bullish</option>
                        <option value="Bearish">Bearish</option>
                        <option value="Neutral">Neutral</option>
                    </select>
                </div>

                <div class="double-field">
                    <div class="input-group">
                        <label for="supportLevel">Support</label>
                        <input id="supportLevel" name="supportLevel" type="text" value="62000" />
                    </div>
                    <div class="input-group">
                        <label for="resistanceLevel">Resistance</label>
                        <input id="resistanceLevel" name="resistanceLevel" type="text" value="68000" />
                    </div>
                </div>

                <div class="double-field">
                    <div class="input-group">
                        <label for="riskReward">Risk / Reward</label>
                        <input id="riskReward" name="riskReward" type="number" step="0.1" value="2.5" />
                    </div>
                    <div class="input-group">
                        <label for="volumeStrength">Volume Strength</label>
                        <input id="volumeStrength" name="volumeStrength" type="number" min="0" max="100" value="75" />
                    </div>
                </div>

                <div class="input-group">
                    <label for="sentiment">Market Sentiment</label>
                    <textarea id="sentiment" name="sentiment" rows="3">Strong bullish momentum with healthy participation</textarea>
                </div>

                <button type="submit">Analyze Trader</button>
            </form>
        </section>

        <section class="panel output-panel">
            <h2>Analysis Result</h2>
            <div id="results" class="results-empty">
                Submit a trade setup to review the strategy.
            </div>
        </section>
    </main>
</div>

<script src="/app.js"></script>
</body>
</html>
