<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Trader Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="brand-wrap">
            <div class="logo">₿</div>
            <div>
                <div class="brand">Crypto Trader Analyzer</div>
                <div class="subtitle">Trend · Risk · Execution</div>
            </div>
        </div>
        <div class="status-pill">Live Strategy Review</div>
    </header>

    <section class="hero-grid" id="marketOverview"></section>

    <main class="main-grid">
        <section class="panel form-panel">
            <div class="panel-header">
                <h1>Trader Setup</h1>
                <span class="panel-tag">Signal Builder</span>
            </div>

            <form id="analysisForm">
                <div class="field-grid two">
                    <div class="input-box">
                        <label for="coinName">Coin / Pair</label>
                        <input id="coinName" name="coinName" type="text" value="BTC" />
                    </div>

                    <div class="input-box">
                        <label for="marketTrend">Market Trend</label>
                        <select id="marketTrend" name="marketTrend">
                            <option value="Bullish">Bullish</option>
                            <option value="Bearish">Bearish</option>
                            <option value="Neutral">Neutral</option>
                        </select>
                    </div>
                </div>

                <div class="field-grid two">
                    <div class="input-box">
                        <label for="supportLevel">Support</label>
                        <input id="supportLevel" name="supportLevel" type="text" value="62000" />
                    </div>
                    <div class="input-box">
                        <label for="resistanceLevel">Resistance</label>
                        <input id="resistanceLevel" name="resistanceLevel" type="text" value="68000" />
                    </div>
                </div>

                <div class="field-grid two">
                    <div class="input-box">
                        <label for="riskReward">Risk / Reward</label>
                        <input id="riskReward" type="number" step="0.1" value="2.5" />
                    </div>
                    <div class="input-box">
                        <label for="volumeStrength">Volume Strength</label>
                        <input id="volumeStrength" type="number" min="0" max="100" value="75" />
                    </div>
                </div>

                <div class="input-box">
                    <label for="sentiment">Market Sentiment</label>
                    <textarea id="sentiment" rows="4">Strong bullish momentum with healthy participation</textarea>
                </div>

                <button type="submit">Analyze Strategy</button>
            </form>
        </section>

        <section class="panel result-panel">
            <div class="panel-header">
                <h2>Market Overview</h2>
                <span class="panel-tag alt">watchlist</span>
            </div>

            <div class="chart-card">
                <div class="chart-head">
                    <div>
                        <div class="chart-title" id="chartTitle">BTC / USD</div>
                        <div class="chart-subtitle" id="chartSubtitle">$67,342.18</div>
                    </div>
                    <div class="trend-badge" id="chartTrend">Bullish</div>
                </div>
                <svg id="priceChart" viewBox="0 0 600 230" preserveAspectRatio="none" aria-label="Price chart"></svg>
            </div>

            <div class="market-table-wrap">
                <table class="market-table">
                    <thead>
                    <tr>
                        <th>Pair</th>
                        <th>Price</th>
                        <th>24h</th>
                        <th>Trend</th>
                    </tr>
                    </thead>
                    <tbody id="marketTableBody"></tbody>
                </table>
            </div>

            <div class="result-panel-inner">
                <h3>Trade Review</h3>
                <div id="results" class="results-empty">
                    Submit a setup to generate a detailed trader review.
                </div>
            </div>
        </section>
    </main>
</div>

<script src="/app.js"></script>
</body>
</html>
